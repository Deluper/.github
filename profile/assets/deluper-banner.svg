<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1D" />
      <stop offset="40%" stop-color="#060A17" />
      <stop offset="100%" stop-color="#03050C" />
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#00C8FF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8247FF" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#B329FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Typography Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0F9FF" />
      <stop offset="70%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="35%" stop-color="#008CFF" />
      <stop offset="70%" stop-color="#8247FF" />
      <stop offset="100%" stop-color="#B329FF" />
    </linearGradient>

    <!-- Atmospheric Glows -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8247FF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8247FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B329FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#B329FF" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#00C8FF" fill-opacity="0.25" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#8247FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glowing Gradient Border -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="20" fill="url(#canvasGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Geometric Grid Pattern Overlay -->
  <rect x="2" y="2" width="1196" height="396" rx="19" fill="url(#matrixGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="260" fill="url(#glowCyan)" />
  <circle cx="600" cy="160" r="320" fill="url(#glowViolet)" />
  <circle cx="1020" cy="220" r="260" fill="url(#glowPurple)" />

  <!-- Logo-Inspired Floating Pixel Motifs (Cyan & Violet Digital Particles) -->
  <g opacity="0.75">
    <rect x="120" y="70" width="12" height="12" rx="2.5" fill="#008CFF" opacity="0.9" />
    <rect x="140" y="86" width="10" height="10" rx="2" fill="#00C8FF" opacity="0.8" />
    <rect x="110" y="98" width="14" height="14" rx="3" fill="#8247FF" opacity="0.85" />
    <rect x="135" y="120" width="8" height="8" rx="2" fill="#B329FF" opacity="0.7" />
    <rect x="160" y="60" width="8" height="8" rx="2" fill="#00C8FF" opacity="0.6" />

    <rect x="1050" y="270" width="14" height="14" rx="3" fill="#00C8FF" opacity="0.8" />
    <rect x="1075" y="250" width="10" height="10" rx="2" fill="#8247FF" opacity="0.75" />
    <rect x="1030" y="300" width="8" height="8" rx="2" fill="#B329FF" opacity="0.6" />
    <rect x="1090" y="290" width="12" height="12" rx="2.5" fill="#008CFF" opacity="0.85" />
  </g>

  <!-- Subtle Geometric Circuit Connectors -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M 50 180 H 180 L 220 220 H 300" fill="none" />
    <circle cx="50" cy="180" r="3" fill="#00C8FF" />
    <circle cx="300" cy="220" r="3" fill="#8247FF" />

    <path d="M 1150 200 H 1020 L 980 160 H 900" fill="none" />
    <circle cx="1150" cy="200" r="3" fill="#B329FF" />
    <circle cx="900" cy="160" r="3" fill="#00C8FF" />
  </g>

  <!-- Central Brand Content -->
  <g filter="url(#shadowFilter)">
    <!-- Top Pill: Brand Identifier -->
    <g transform="translate(435, 52)">
      <rect x="0" y="0" width="330" height="30" rx="15" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="20" cy="15" r="4.5" fill="#00C8FF" />
      <text x="36" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8">COMMERCIAL SOFTWARE &amp; TECHNOLOGY</text>
    </g>

    <!-- DELUPER Main Heading -->
    <text x="600" y="172" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="9">DELUPER</text>

    <!-- Tagline: Engineering Digital Possibilities. -->
    <text x="600" y="218" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="4.5">ENGINEERING DIGITAL POSSIBILITIES</text>

    <!-- Mission & Capabilities Description -->
    <text x="600" y="260" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.4">Building intelligent software, scalable platforms, and digital experiences for the future.</text>

    <!-- Capability Indicators Bar -->
    <g transform="translate(180, 305)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="36" rx="9" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
        <text x="95" y="23" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⚡ SaaS Development</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="200" height="36" rx="9" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
        <text x="100" y="23" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">☁️ Cloud Infrastructure</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="195" height="36" rx="9" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
        <text x="97" y="23" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">⚙️ Backend Systems</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(660, 0)">
        <rect x="0" y="0" width="180" height="36" rx="9" fill="#0B1329" stroke="#1E293B" stroke-width="1" />
        <text x="90" y="23" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">🚀 Automation &amp; APIs</text>
      </g>
    </g>
  </g>
</svg>
